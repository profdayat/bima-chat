name: bima-chat

services:
  backend:
    build:
      context: ../
      dockerfile: packages/backend/develop.dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - APP_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-bimachat_user}
      - DB_PASSWORD=${DB_PASSWORD:-bima_rsud_secret2026}
      - DB_NAME=${DB_NAME:-bima_chat_db}
      - REDIS_URL=redis://redis:6379
      - MONOREPO_ROOT=/app
    volumes:
      - uploads-data:/app/packages/frontend/static/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chat-net

  frontend:
    build:
      context: ../
      dockerfile: packages/frontend/develop.dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8080
    ports:
      - "${FRONTEND_PORT:-8095}:5173"
    volumes:
      - uploads-data:/app/packages/frontend/static/uploads
    depends_on:
      - backend
    networks:
      - chat-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bimachat_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bima_rsud_secret2026}
      POSTGRES_DB: ${DB_NAME:-bima_chat_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bimachat_user} -d ${DB_NAME:-bima_chat_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chat-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chat-net

networks:
  chat-net:
    name: bima-chat-net
    driver: bridge

volumes:
  postgres-data:
    name: bima-chat_postgres-data
  redis-data:
    name: bima-chat_redis-data
  uploads-data:
    name: bima-chat_uploads-data
