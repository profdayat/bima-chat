resolver 127.0.0.11 valid=10s ipv6=off;

upstream chat_backend {
    zone chat_backend_zone 64k;
    server bima-chat-backend-blue:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

upstream chat_frontend {
    zone chat_frontend_zone 64k;
    server bima-chat-frontend-blue:5173 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8095;
    server_name _;

    client_max_body_size 50M;

    # SSE endpoints — CRITICAL: disable buffering
    location ~ ^/api/chat/sse/ {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # API Endpoints & Swagger Docs
    location /api/ {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Uploaded Media Serving
    location /uploads/ {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Frontend SvelteKit PWA App & WebSocket HMR
    location / {
        proxy_pass http://chat_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }
}
