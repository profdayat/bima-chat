resolver 127.0.0.11 valid=10s ipv6=off;

upstream chat_backend {
    zone chat_backend_zone 64k;
    server bima-chat-backend-blue:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

upstream chat_frontend {
    zone chat_frontend_zone 64k;
    server bima-chat-frontend-blue:5173 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8095;
    server_name _;

    client_max_body_size 50M;

    # Gzip Compression for high Lighthouse Performance scores
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security & Best Practice Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SvelteKit Immutable Static Asset Caching
    location /_app/immutable/ {
        proxy_pass http://chat_frontend;
        proxy_http_version 1.1;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Favicon & Static Root Icons Caching
    location ~* \.(?:ico|png|jpg|jpeg|svg|webp|avif|gif|json)$ {
        proxy_pass http://chat_frontend;
        proxy_http_version 1.1;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Vary "Accept-Encoding";
    }

    # Uploaded user media — WebP/images served with long-lived cache
    location ~* ^/api/uploads/.*\.(?:webp|jpg|jpeg|png|gif|avif)$ {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary "Accept-Encoding";
    }

    # SSE endpoints — CRITICAL: disable buffering
    location ~ ^/api/chat/sse/ {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # API Endpoints & Swagger Docs
    location /api/ {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Uploaded Media Serving
    location /uploads/ {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Frontend SvelteKit PWA App & WebSocket HMR
    location / {
        proxy_pass http://chat_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }
}
